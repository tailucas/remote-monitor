[project]
name = "app"
version = "0.1.0"
description = "Remote monitor"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Tai Lucas", email = "tglucas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "abelectronics",
    "pika>=1.3.2",
    "rpi-gpio>=0.7.1",
    "sentry-sdk>=2.38.0",
    "smbus2>=0.5.0",
    "tailucas-pylib[monitoring,mq]>=0.7.7",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv.sources]
abelectronics = { git = "https://github.com/abelectronicsuk/ABElectronics_Python_Libraries.git" }

[project.scripts]
aws_configure = "tailucas_pylib.tools.aws_configure:main"
config_interpol = "tailucas_pylib.tools.config_interpol:main"
cred_tool = "tailucas_pylib.tools.cred_tool:main"
yaml_interpol = "tailucas_pylib.tools.yaml_interpol:main"

[tool.ruff]
target-version = "py314"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
files = ["app"]
ignore_missing_imports = true
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
